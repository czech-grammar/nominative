<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e8c"/>
      <stop offset="100%" style="stop-color:#c51877"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#9f7aea"/>
      <stop offset="100%" style="stop-color:#805ad5"/>
    </linearGradient>
  </defs>

  <!-- Main card background -->
  <rect x="20" y="20" width="760" height="460" rx="20" fill="url(#cardBg)" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="400" y="60" text-anchor="middle" font-size="26" font-weight="bold" fill="white">Adjective Endings in Locative</text>
  <text x="400" y="85" text-anchor="middle" font-size="14" fill="#a0aec0">Hard adjectives use É family • Soft adjectives use Í family</text>

  <!-- Divider line -->
  <line x1="60" y1="105" x2="740" y2="105" stroke="#4a5568" stroke-width="1"/>

  <!-- Left Column: HARD ADJECTIVES -->
  <rect x="45" y="120" width="345" height="340" rx="15" fill="#1a202c" stroke="url(#pinkGrad)" stroke-width="3"/>

  <rect x="45" y="120" width="345" height="50" rx="15" fill="url(#pinkGrad)"/>
  <rect x="45" y="145" width="345" height="25" fill="url(#pinkGrad)"/>
  <text x="217" y="155" text-anchor="middle" font-size="24" font-weight="bold" fill="white">HARD ADJECTIVES</text>
  <text x="217" y="195" text-anchor="middle" font-size="13" fill="#a0aec0">(nový, starý, dobrý, velký...)</text>

  <!-- Singular section -->
  <text x="70" y="230" font-size="14" font-weight="600" fill="#e91e8c">SINGULAR</text>

  <text x="70" y="260" font-size="14" fill="#e2e8f0">Masculine:</text>
  <text x="170" y="260" font-size="14" fill="#e2e8f0">-ý → <tspan fill="#e91e8c" font-weight="bold">-ém</tspan></text>
  <text x="280" y="260" font-size="13" fill="#a0aec0">v novém</text>

  <text x="70" y="285" font-size="14" fill="#e2e8f0">Neuter:</text>
  <text x="170" y="285" font-size="14" fill="#e2e8f0">-é → <tspan fill="#e91e8c" font-weight="bold">-ém</tspan></text>
  <text x="280" y="285" font-size="13" fill="#a0aec0">v novém</text>

  <text x="70" y="310" font-size="14" fill="#e2e8f0">Feminine:</text>
  <text x="170" y="310" font-size="14" fill="#e2e8f0">-á → <tspan fill="#e91e8c" font-weight="bold">-é</tspan></text>
  <text x="280" y="310" font-size="13" fill="#a0aec0">v nové</text>

  <!-- Plural section -->
  <line x1="60" y1="335" x2="380" y2="335" stroke="#4a5568" stroke-width="1"/>
  <text x="70" y="365" font-size="14" font-weight="600" fill="#e91e8c">PLURAL (all genders)</text>

  <text x="70" y="395" font-size="14" fill="#e2e8f0">All:</text>
  <text x="170" y="395" font-size="14" fill="#e2e8f0">→ <tspan fill="#e91e8c" font-weight="bold">-ých</tspan></text>
  <text x="280" y="395" font-size="13" fill="#a0aec0">v nových</text>

  <rect x="60" y="420" width="315" height="25" rx="5" fill="#2d3748"/>
  <text x="217" y="437" text-anchor="middle" font-size="12" fill="#f687b3">É family: -ém, -é, -ých</text>

  <!-- Right Column: SOFT ADJECTIVES -->
  <rect x="410" y="120" width="345" height="340" rx="15" fill="#1a202c" stroke="url(#purpleGrad)" stroke-width="3"/>

  <rect x="410" y="120" width="345" height="50" rx="15" fill="url(#purpleGrad)"/>
  <rect x="410" y="145" width="345" height="25" fill="url(#purpleGrad)"/>
  <text x="582" y="155" text-anchor="middle" font-size="24" font-weight="bold" fill="white">SOFT ADJECTIVES</text>
  <text x="582" y="195" text-anchor="middle" font-size="13" fill="#a0aec0">(cizí, jarní, poslední...)</text>

  <!-- Singular section -->
  <text x="435" y="230" font-size="14" font-weight="600" fill="#9f7aea">SINGULAR</text>

  <text x="435" y="260" font-size="14" fill="#e2e8f0">Masculine:</text>
  <text x="535" y="260" font-size="14" fill="#e2e8f0">-í → <tspan fill="#9f7aea" font-weight="bold">-ím</tspan></text>
  <text x="645" y="260" font-size="13" fill="#a0aec0">v cizím</text>

  <text x="435" y="285" font-size="14" fill="#e2e8f0">Neuter:</text>
  <text x="535" y="285" font-size="14" fill="#e2e8f0">-í → <tspan fill="#9f7aea" font-weight="bold">-ím</tspan></text>
  <text x="645" y="285" font-size="13" fill="#a0aec0">v cizím</text>

  <text x="435" y="310" font-size="14" fill="#e2e8f0">Feminine:</text>
  <text x="535" y="310" font-size="14" fill="#e2e8f0">-í → <tspan fill="#9f7aea" font-weight="bold">-í</tspan></text>
  <text x="645" y="310" font-size="13" fill="#a0aec0">v cizí (same!)</text>

  <!-- Plural section -->
  <line x1="425" y1="335" x2="745" y2="335" stroke="#4a5568" stroke-width="1"/>
  <text x="435" y="365" font-size="14" font-weight="600" fill="#9f7aea">PLURAL (all genders)</text>

  <text x="435" y="395" font-size="14" fill="#e2e8f0">All:</text>
  <text x="535" y="395" font-size="14" fill="#e2e8f0">→ <tspan fill="#9f7aea" font-weight="bold">-ích</tspan></text>
  <text x="645" y="395" font-size="13" fill="#a0aec0">v cizích</text>

  <rect x="425" y="420" width="315" height="25" rx="5" fill="#2d3748"/>
  <text x="582" y="437" text-anchor="middle" font-size="12" fill="#b794f4">Í family: -ím, -í, -ích</text>
</svg>
