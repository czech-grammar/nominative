<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="4" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a202c"/>
      <stop offset="100%" style="stop-color:#2d3748"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#38b2ac"/>
      <stop offset="100%" style="stop-color:#319795"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ed8936"/>
      <stop offset="100%" style="stop-color:#dd6b20"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4299e1"/>
      <stop offset="100%" style="stop-color:#3182ce"/>
    </linearGradient>
  </defs>

  <!-- Main card background -->
  <rect x="20" y="20" width="760" height="510" rx="20" fill="url(#cardBg)" filter="url(#shadow)"/>

  <!-- Header -->
  <text x="400" y="55" text-anchor="middle" font-size="24" font-weight="bold" fill="white">Possessives, Demonstratives &amp; Interrogatives</text>
  <text x="400" y="78" text-anchor="middle" font-size="13" fill="#a0aec0">Special adjective-like words in Locative</text>

  <!-- Divider line -->
  <line x1="60" y1="95" x2="740" y2="95" stroke="#4a5568" stroke-width="1"/>

  <!-- Column 1: POSSESSIVES -->
  <rect x="35" y="110" width="240" height="400" rx="15" fill="#1a202c" stroke="url(#tealGrad)" stroke-width="3"/>

  <rect x="35" y="110" width="240" height="45" rx="15" fill="url(#tealGrad)"/>
  <rect x="35" y="135" width="240" height="20" fill="url(#tealGrad)"/>
  <text x="155" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="white">POSSESSIVES</text>

  <text x="55" y="185" font-size="12" font-weight="600" fill="#38b2ac">MASC./NEUT.</text>
  <text x="185" y="185" font-size="12" font-weight="600" fill="#38b2ac">FEM.</text>

  <text x="55" y="210" font-size="13" fill="#e2e8f0">můj →</text>
  <text x="105" y="210" font-size="13" fill="#38b2ac" font-weight="bold">mém</text>
  <text x="185" y="210" font-size="13" fill="#38b2ac" font-weight="bold">mé</text>

  <text x="55" y="235" font-size="13" fill="#e2e8f0">tvůj →</text>
  <text x="105" y="235" font-size="13" fill="#38b2ac" font-weight="bold">tvém</text>
  <text x="185" y="235" font-size="13" fill="#38b2ac" font-weight="bold">tvé</text>

  <text x="55" y="260" font-size="13" fill="#e2e8f0">jeho →</text>
  <text x="105" y="260" font-size="13" fill="#a0aec0">jeho</text>
  <text x="185" y="260" font-size="13" fill="#a0aec0">jeho</text>
  <text x="230" y="260" font-size="10" fill="#718096">✓</text>

  <text x="55" y="285" font-size="13" fill="#e2e8f0">její →</text>
  <text x="105" y="285" font-size="13" fill="#38b2ac" font-weight="bold">jejím</text>
  <text x="185" y="285" font-size="13" fill="#38b2ac" font-weight="bold">její</text>

  <text x="55" y="310" font-size="13" fill="#e2e8f0">náš →</text>
  <text x="105" y="310" font-size="13" fill="#38b2ac" font-weight="bold">našem</text>
  <text x="185" y="310" font-size="13" fill="#38b2ac" font-weight="bold">naší</text>

  <text x="55" y="335" font-size="13" fill="#e2e8f0">váš →</text>
  <text x="105" y="335" font-size="13" fill="#38b2ac" font-weight="bold">vašem</text>
  <text x="185" y="335" font-size="13" fill="#38b2ac" font-weight="bold">vaší</text>

  <text x="55" y="360" font-size="13" fill="#e2e8f0">jejich →</text>
  <text x="105" y="360" font-size="13" fill="#a0aec0">jejich</text>
  <text x="185" y="360" font-size="13" fill="#a0aec0">jejich</text>
  <text x="230" y="360" font-size="10" fill="#718096">✓</text>

  <line x1="50" y1="380" x2="260" y2="380" stroke="#4a5568" stroke-width="1"/>

  <text x="55" y="405" font-size="12" fill="#e2e8f0">v <tspan fill="#38b2ac" font-weight="bold">mém</tspan> domě</text>
  <text x="55" y="425" font-size="12" fill="#e2e8f0">v <tspan fill="#38b2ac" font-weight="bold">naší</tspan> škole</text>
  <text x="55" y="445" font-size="12" fill="#e2e8f0">v <tspan fill="#a0aec0">jeho</tspan> autě</text>

  <rect x="50" y="460" width="210" height="35" rx="5" fill="#2d3748"/>
  <text x="155" y="479" text-anchor="middle" font-size="11" fill="#4fd1c5">✓ jeho/jejich never change</text>

  <!-- Column 2: DEMONSTRATIVES -->
  <rect x="285" y="110" width="230" height="400" rx="15" fill="#1a202c" stroke="url(#orangeGrad)" stroke-width="3"/>

  <rect x="285" y="110" width="230" height="45" rx="15" fill="url(#orangeGrad)"/>
  <rect x="285" y="135" width="230" height="20" fill="url(#orangeGrad)"/>
  <text x="400" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="white">DEMONSTRATIVES</text>

  <text x="305" y="185" font-size="12" font-weight="600" fill="#ed8936">THIS / THAT</text>

  <text x="305" y="215" font-size="13" fill="#e2e8f0">ten (that m.) →</text>
  <text x="420" y="215" font-size="13" fill="#ed8936" font-weight="bold">tom</text>

  <text x="305" y="240" font-size="13" fill="#e2e8f0">ta (that f.) →</text>
  <text x="420" y="240" font-size="13" fill="#ed8936" font-weight="bold">té</text>

  <text x="305" y="265" font-size="13" fill="#e2e8f0">to (that n.) →</text>
  <text x="420" y="265" font-size="13" fill="#ed8936" font-weight="bold">tom</text>

  <text x="305" y="300" font-size="13" fill="#e2e8f0">plural (all) →</text>
  <text x="420" y="300" font-size="13" fill="#ed8936" font-weight="bold">těch</text>

  <line x1="300" y1="325" x2="500" y2="325" stroke="#4a5568" stroke-width="1"/>

  <text x="305" y="355" font-size="12" font-weight="600" fill="#ed8936">EXAMPLES</text>

  <text x="305" y="385" font-size="12" fill="#e2e8f0">v <tspan fill="#ed8936" font-weight="bold">tom</tspan> domě</text>
  <text x="305" y="410" font-size="12" fill="#e2e8f0">v <tspan fill="#ed8936" font-weight="bold">té</tspan> knize</text>
  <text x="305" y="435" font-size="12" fill="#e2e8f0">v <tspan fill="#ed8936" font-weight="bold">tom</tspan> městě</text>
  <text x="305" y="460" font-size="12" fill="#e2e8f0">v <tspan fill="#ed8936" font-weight="bold">těch</tspan> domech</text>

  <rect x="300" y="475" width="200" height="20" rx="5" fill="#2d3748"/>
  <text x="400" y="489" text-anchor="middle" font-size="11" fill="#fbd38d">tom (m/n), té (f), těch (pl)</text>

  <!-- Column 3: INTERROGATIVES -->
  <rect x="525" y="110" width="230" height="400" rx="15" fill="#1a202c" stroke="url(#blueGrad)" stroke-width="3"/>

  <rect x="525" y="110" width="230" height="45" rx="15" fill="url(#blueGrad)"/>
  <rect x="525" y="135" width="230" height="20" fill="url(#blueGrad)"/>
  <text x="640" y="142" text-anchor="middle" font-size="18" font-weight="bold" fill="white">INTERROGATIVES</text>

  <text x="545" y="185" font-size="12" font-weight="600" fill="#4299e1">KTERÝ (WHICH)</text>

  <text x="545" y="215" font-size="13" fill="#e2e8f0">m./n. sg. →</text>
  <text x="640" y="215" font-size="13" fill="#4299e1" font-weight="bold">kterém</text>

  <text x="545" y="240" font-size="13" fill="#e2e8f0">fem. sg. →</text>
  <text x="640" y="240" font-size="13" fill="#4299e1" font-weight="bold">které</text>

  <text x="545" y="265" font-size="13" fill="#e2e8f0">plural →</text>
  <text x="640" y="265" font-size="13" fill="#4299e1" font-weight="bold">kterých</text>

  <line x1="540" y1="285" x2="740" y2="285" stroke="#4a5568" stroke-width="1"/>

  <text x="545" y="310" font-size="12" font-weight="600" fill="#4299e1">JAKÝ (WHAT KIND)</text>

  <text x="545" y="340" font-size="13" fill="#e2e8f0">m./n. sg. →</text>
  <text x="640" y="340" font-size="13" fill="#4299e1" font-weight="bold">jakém</text>

  <text x="545" y="365" font-size="13" fill="#e2e8f0">fem. sg. →</text>
  <text x="640" y="365" font-size="13" fill="#4299e1" font-weight="bold">jaké</text>

  <text x="545" y="390" font-size="13" fill="#e2e8f0">plural →</text>
  <text x="640" y="390" font-size="13" fill="#4299e1" font-weight="bold">jakých</text>

  <line x1="540" y1="410" x2="740" y2="410" stroke="#4a5568" stroke-width="1"/>

  <text x="545" y="440" font-size="12" fill="#e2e8f0">Ve <tspan fill="#4299e1" font-weight="bold">kterém</tspan> domě?</text>
  <text x="545" y="465" font-size="12" fill="#e2e8f0">V <tspan fill="#4299e1" font-weight="bold">jakém</tspan> stavu?</text>

  <rect x="540" y="480" width="200" height="20" rx="5" fill="#2d3748"/>
  <text x="640" y="494" text-anchor="middle" font-size="11" fill="#63b3ed">Same as hard adj: -ém, -é, -ých</text>
</svg>
